<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cimzx Official</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --primary: #a855f7;
  --primary-soft: #c084fc;
  --primary-glow: rgba(168, 85, 247, 0.4);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
background:#06010f;
color:white;
display:flex;
justify-content:center;
padding:30px 15px;
}

/* BG GRID */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(168,85,247,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(168,85,247,0.05) 1px, transparent 1px);
background-size:80px 80px;
z-index:-1;
}

.container{max-width:400px;width:100%;}

/* PROFILE */
.profile{
background:rgba(20,0,40,0.6);
border-radius:18px;
padding:24px;
text-align:center;
border:1px solid rgba(168,85,247,0.4);
animation: glow 3s infinite;
margin-bottom:15px;
}

.profile img{
width:95px;height:95px;border-radius:50%;
border:2px solid var(--primary);
box-shadow:0 0 10px var(--primary);
margin-bottom:10px;
}

.title{font-size:22px;color:var(--primary-soft);}
.subtitle{font-size:11px;opacity:.7;}

/* MENU */
.menu{display:flex;gap:10px;margin-bottom:15px;}

.menu-btn{
flex:1;
padding:10px;
border:none;
border-radius:10px;
background:rgba(30,0,60,0.5);
color:white;
cursor:pointer;
transition:.2s;
}

.menu-btn.active{
background:var(--primary);
box-shadow:0 0 10px var(--primary);
}

.menu-content{
display:none;
opacity:0;
transform:translateY(10px);
transition:.3s;
}

.menu-content.active{
display:block;
opacity:1;
transform:translateY(0);
}

/* IMAGE */
.video-box{
background:rgba(30,0,60,0.5);
border-radius:12px;
padding:6px;
margin-bottom:10px;
}

.video-box img{
width:100%;height:150px;
object-fit:cover;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.video-box img:hover{transform:scale(1.05);}

/* LINK */
.link{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(30,0,60,0.5);
border-radius:12px;
padding:13px;
margin-bottom:9px;
cursor:pointer;
transition:.2s;
}

.link:hover{
transform:scale(1.03);
box-shadow:0 0 10px var(--primary);
}

.link:active{transform:scale(0.9);}

.link-left{
display:flex;
align-items:center;
gap:10px;
}

.icon{color:var(--primary-soft);}

/* MODAL */
.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.85);
backdrop-filter:blur(6px);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:.3s;
}

.modal.show{
opacity:1;
pointer-events:auto;
}

.modal img{
max-width:85%;
border-radius:15px;
box-shadow:0 0 20px var(--primary);
transform:scale(0.8);
transition:.3s;
}

.modal.show img{transform:scale(1);}

.close-btn{
position:absolute;
top:20px;
right:25px;
font-size:28px;
color:white;
cursor:pointer;
}

/* TOAST */
#toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:var(--primary);
padding:10px 16px;
border-radius:10px;
display:none;
}

/* ANIM */
@keyframes glow{
0%{box-shadow:0 0 5px var(--primary-glow);}
50%{box-shadow:0 0 20px var(--primary);}
100%{box-shadow:0 0 5px var(--primary-glow);}
}
</style>
</head>

<body>

<div class="container">

<div class="profile">
<img src="https://files.catbox.moe/cslci4.jpg">
<div class="title">FANZ STARBOY</div>
<div class="subtitle">FANDI THE DEVELOPER</div>
</div>

<div class="menu">
<button class="menu-btn active" onclick="showMenu('pay', this)">PAYMENT</button>
<button class="menu-btn" onclick="showMenu('produk', this)">PRODUK</button>
</div>

<!-- PAYMENT -->
<div id="pay" class="menu-content active">

<div class="video-box" onclick="openQRIS()">
<img src="https://files.catbox.moe/dtgik4.jpg">
</div>

<div class="link" onclick="openQRIS()">
<div class="link-left">
<i class="fas fa-qrcode icon"></i>
<div>QRIS Payment</div>
</div>
<div>→</div>
</div>

<div class="link" onclick="copyDana()">
<div class="link-left">
<i class="fas fa-wallet icon"></i>
<div>DANA</div>
</div>
<div>→</div>
</div>

</div>

<!-- PRODUK -->
<div id="produk" class="menu-content">

<div class="link" onclick="buy('Script Bot')">
<div class="link-left"><i class="fas fa-robot icon"></i><div>SCRIPT BOT - 20K</div></div>
<div>→</div>
</div>

<div class="link" onclick="buy('Web Hosting')">
<div class="link-left"><i class="fas fa-globe icon"></i><div>WEB HOSTING - 30K</div></div>
<div>→</div>
</div>

<div class="link" onclick="buy('Deploy Web')">
<div class="link-left"><i class="fas fa-code icon"></i><div>DEPLOY WEB - 20K</div></div>
<div>→</div>
</div>

<div class="link" onclick="buy('Panel VPS')">
<div class="link-left"><i class="fas fa-server icon"></i><div>PANEL VPS - 10K</div></div>
<div>→</div>
</div>

</div>

</div>

<!-- QRIS MODAL -->
<div id="qrisModal" class="modal">
<span class="close-btn" onclick="closeQRIS()">&times;</span>
<img src="https://cdn.nekohime.site/file/XisfJoVp.png">
</div>

<!-- MUSIC -->
<button onclick="toggleMusic()" style="
position:fixed;
bottom:80px;
right:20px;
background:#a855f7;
border:none;
color:white;
padding:12px;
border-radius:50%;
box-shadow:0 0 10px var(--primary);
">🎵</button>

<audio id="bgMusic" loop preload="auto">
  <source src="https://files.catbox.moe/4k4ksz.mp3" type="audio/mp3">
</audio>

<div id="toast">Nomor disalin!</div>

<script>
function openQRIS(){
document.getElementById("qrisModal").classList.add("show");
}

function closeQRIS(){
document.getElementById("qrisModal").classList.remove("show");
}

document.getElementById("qrisModal").addEventListener("click", function(e){
if(e.target === this){closeQRIS();}
});

function showMenu(menu, el){
document.querySelectorAll('.menu-content').forEach(e=>e.classList.remove('active'))
document.querySelectorAll('.menu-btn').forEach(e=>e.classList.remove('active'))
document.getElementById(menu).classList.add('active')
el.classList.add('active')
}

function copyDana(){
navigator.clipboard.writeText("083186767760");
let t=document.getElementById("toast");
t.style.display="block";
setTimeout(()=>t.style.display="none",2000);
}

let music=document.getElementById("bgMusic");
let isPlay=false;

function toggleMusic(){
if(isPlay){music.pause();}
else{music.play();}
isPlay=!isPlay;
}

document.body.addEventListener("click", function() {
  if (!isPlay) {
    music.play().then(() => {
      isPlay = true;
    }).catch(() => {});
  }
}, { once: true });

function buy(product){
let url=`https://wa.me/6283186767760?text=Halo saya mau beli ${product}`;
window.open(url,'_blank');
}
</script>

</body>
  </html>
